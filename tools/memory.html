<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>משחק זיכרון · משכן סידב</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="tools.css" rel="stylesheet">
    <style>
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.6rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }
        .level-btn { padding: 0.5rem 1.2rem; }
        .level-btn[aria-pressed="true"] { background: var(--ink); color: var(--gold-bright); }
        .stats {
            display: flex;
            justify-content: center;
            gap: 1.4rem;
            flex-wrap: wrap;
            color: var(--ink-soft);
            font-weight: 600;
            margin-bottom: 1.2rem;
        }
        .stats b { color: var(--wine); font-family: var(--font-display); font-size: 1.2rem; }

        .board {
            display: grid;
            grid-template-columns: repeat(var(--cols, 4), 1fr);
            gap: 0.7rem;
            max-width: 640px;
            margin: 0 auto;
        }
        @media (max-width: 560px) {
            .board { --cols: 4 !important; gap: 0.45rem; }
        }

        .mem-card {
            aspect-ratio: 3 / 4;
            perspective: 800px;
            border: none;
            background: none;
            padding: 0;
            cursor: pointer;
            font: inherit;
        }
        .mem-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.45s var(--ease);
            transform-style: preserve-3d;
        }
        .mem-card.flipped .mem-inner, .mem-card.matched .mem-inner { transform: rotateY(180deg); }
        .mem-face {
            position: absolute;
            inset: 0;
            border-radius: 12px;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-sm);
        }
        /* Card back: night-blue with a brass arch, the site's signature motif. */
        .mem-back {
            background: linear-gradient(160deg, var(--ink) 0%, var(--ink-light) 100%);
            border: 2px solid var(--gold);
        }
        .mem-back::after {
            content: '';
            width: 46%;
            height: 52%;
            border: 2px solid var(--gold-bright);
            border-bottom: none;
            border-radius: 999px 999px 4px 4px;
            opacity: 0.8;
        }
        .mem-front {
            background: var(--paper);
            border: 2px solid var(--stone-dark);
            transform: rotateY(180deg);
            padding: 6%;
        }
        .mem-front svg { width: 82%; height: auto; flex: 1; }
        .mem-front span {
            font-weight: 700;
            color: var(--ink);
            font-size: clamp(0.62rem, 2.6vw, 0.88rem);
            line-height: 1.2;
            text-align: center;
        }
        .mem-card.matched .mem-front { border-color: var(--ok); background: #f3f8f1; }
        .mem-card:focus-visible { outline: 3px solid var(--gold-bright); outline-offset: 3px; border-radius: 12px; }

        .win {
            text-align: center;
            margin-top: 1.4rem;
        }
        .win h2 { color: var(--ok); font-size: 1.6rem; }
        .win p { color: var(--ink-soft); margin: 0.4rem 0 1rem; }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="../index.html"><i class="fa-solid fa-arrow-right"></i> לאתר בית הכנסת</a>
        <a href="index.html"><i class="fa-solid fa-table-cells-large"></i> כל הכלים והמשחקים</a>
    </div>

    <header class="page-header">
        <p class="eyebrow">משחקים</p>
        <h1>משחק זיכרון</h1>
        <p>מצאו את הזוגות של תשמישי הקדושה והמקומות הקדושים</p>
    </header>

    <main>
        <div class="card">
            <div class="controls" role="group" aria-label="רמת קושי">
                <button type="button" class="btn secondary level-btn" data-pairs="6">קל · 6 זוגות</button>
                <button type="button" class="btn secondary level-btn" data-pairs="8">בינוני · 8 זוגות</button>
                <button type="button" class="btn secondary level-btn" data-pairs="12">קשה · 12 זוגות</button>
            </div>
            <div class="stats" aria-live="polite">
                <span>מהלכים: <b id="moves">0</b></span>
                <span>זוגות: <b id="found">0</b>/<b id="total">0</b></span>
                <span>זמן: <b id="time">0:00</b></span>
            </div>
            <div class="board" id="board"></div>
            <div class="win" id="win" hidden></div>
        </div>
    </main>

    <footer>
        <p>בית כנסת משכן סידב · <a href="index.html">כלים ומשחקים</a> · <a href="../index.html">לאתר הראשי</a></p>
    </footer>

    <script>
        const GOLD = '#b8925a', GOLD_DARK = '#7a5a2e', INK = '#2f4269', WINE = '#6e2532';
        const flame = (x, y) => `<ellipse cx="${x}" cy="${y}" rx="3" ry="6" fill="#f0a030"/><ellipse cx="${x}" cy="${y + 1.5}" rx="1.4" ry="3" fill="#fde68a"/>`;

        // Hand-drawn 100×100 illustrations, in the site palette.
        const ITEMS = [
            { id: 'shofar', name: 'שופר', svg: `
                <path d="M12 80 Q14 70 24 64 Q44 54 60 40 Q72 28 76 12 L94 24 Q86 44 68 56 Q46 70 26 74 Q18 76 16 82 Z" fill="#d9b382" stroke="#8a5a2b" stroke-width="2.5" stroke-linejoin="round"/>
                <path d="M30 69 Q48 61 64 47" fill="none" stroke="#b88a55" stroke-width="2"/>
                <ellipse cx="85" cy="18" rx="10" ry="4.5" transform="rotate(34 85 18)" fill="#6b4421"/>` },
            { id: 'lulav', name: 'לולב', svg: `
                <ellipse cx="37" cy="42" rx="4" ry="20" transform="rotate(-10 37 42)" fill="#9cc47a"/>
                <ellipse cx="42" cy="38" rx="3.5" ry="20" transform="rotate(-4 42 38)" fill="#8fbf6a"/>
                ${[26, 34, 42, 50, 58].map(y => `<circle cx="62" cy="${y}" r="4" fill="#3f6b2c"/><circle cx="67" cy="${y + 4}" r="3.5" fill="#4f7d3a"/>`).join('')}
                <path d="M50 6 L55 70 L45 70 Z" fill="#6f9e4a" stroke="#4f7d3a" stroke-width="1.5"/>
                <line x1="50" y1="10" x2="50" y2="92" stroke="#4f7d3a" stroke-width="3"/>
                <rect x="40" y="66" width="20" height="9" rx="2" fill="${GOLD}"/>` },
            { id: 'chanukiah', name: 'חנוכייה', svg: `
                <rect x="34" y="86" width="32" height="6" rx="3" fill="${GOLD}"/>
                <rect x="47" y="58" width="6" height="30" fill="${GOLD}"/>
                <rect x="8" y="56" width="84" height="5" rx="2.5" fill="${GOLD}"/>
                ${[13, 22, 31, 40, 60, 69, 78, 87].map(x => `<rect x="${x - 2}" y="44" width="4" height="12" fill="#fff" stroke="#c9bc9c"/>${flame(x, 37)}`).join('')}
                <rect x="45" y="44" width="10" height="13" fill="${GOLD}"/>
                <rect x="48" y="30" width="4" height="14" fill="#fff" stroke="#c9bc9c"/>${flame(50, 23)}` },
            { id: 'torah', name: 'ספר תורה', svg: `
                <rect x="22" y="8" width="5" height="86" rx="2.5" fill="#6b4421"/>
                <rect x="73" y="8" width="5" height="86" rx="2.5" fill="#6b4421"/>
                <circle cx="24.5" cy="8" r="5" fill="${GOLD}"/><circle cx="75.5" cy="8" r="5" fill="${GOLD}"/>
                <rect x="34" y="26" width="32" height="48" fill="#fffaf0" stroke="#c9bc9c"/>
                ${[33, 39, 45, 51, 57, 63, 69].map(y => `<line x1="38" y1="${y}" x2="62" y2="${y}" stroke="#555" stroke-width="1.6"/>`).join('')}
                <rect x="15" y="22" width="19" height="56" rx="9" fill="#efe3c4" stroke="#8a6a3a" stroke-width="2"/>
                <rect x="66" y="22" width="19" height="56" rx="9" fill="#efe3c4" stroke="#8a6a3a" stroke-width="2"/>` },
            { id: 'candles', name: 'נרות שבת', svg: [34, 66].map(x => `
                <rect x="${x - 12}" y="86" width="24" height="5" rx="2.5" fill="${GOLD}"/>
                <rect x="${x - 3}" y="56" width="6" height="32" fill="${GOLD}"/>
                <path d="M${x - 10} 50 H${x + 10} L${x + 6} 57 H${x - 6} Z" fill="${GOLD}"/>
                <rect x="${x - 4}" y="22" width="8" height="28" fill="#fff" stroke="#c9bc9c"/>
                ${flame(x, 14)}`).join('') },
            { id: 'kiddush', name: 'גביע קידוש', svg: `
                <path d="M26 16 H74 Q74 52 50 60 Q26 52 26 16 Z" fill="#c9ced6" stroke="#7d8794" stroke-width="2"/>
                <path d="M30 24 H70 Q68 48 50 54 Q32 48 30 24 Z" fill="${WINE}"/>
                <rect x="46" y="59" width="8" height="22" fill="#aab1bb"/>
                <ellipse cx="50" cy="84" rx="20" ry="6" fill="#aab1bb" stroke="#7d8794" stroke-width="2"/>` },
            { id: 'mezuzah', name: 'מזוזה', svg: `
                <rect x="34" y="8" width="32" height="84" rx="12" fill="${GOLD}" stroke="${GOLD_DARK}" stroke-width="2.5"/>
                <rect x="40" y="16" width="20" height="68" rx="8" fill="none" stroke="#e9d3a8" stroke-width="1.5"/>
                <text x="50" y="47" text-anchor="middle" dominant-baseline="central" font-family="Frank Ruhl Libre, serif" font-size="26" font-weight="700" fill="#fffdf7">ש</text>` },
            { id: 'magen', name: 'מגן דוד', svg: `
                <polygon points="50,10 84.6,70 15.4,70" fill="none" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/>
                <polygon points="50,90 15.4,30 84.6,30" fill="none" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/>` },
            { id: 'etrog', name: 'אתרוג', svg: `
                <path d="M50 18 Q78 26 76 56 Q74 84 50 88 Q26 84 24 56 Q22 26 50 18 Z" fill="#e8c547" stroke="#b8962a" stroke-width="2"/>
                <rect x="48" y="9" width="4" height="10" rx="2" fill="#7a5a2e"/>
                <path d="M42 30 Q36 40 38 52" fill="none" stroke="#f5dc7a" stroke-width="3" stroke-linecap="round"/>
                ${[[60, 40], [56, 62], [44, 70], [64, 54], [40, 58]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="1.3" fill="#c9a52e"/>`).join('')}` },
            { id: 'kotel', name: 'הכותל המערבי', svg: `
                <defs><clipPath id="kotel-clip"><rect x="8" y="14" width="84" height="76"/></clipPath></defs>
                <rect x="8" y="14" width="84" height="76" fill="#b9aa84"/>
                <g clip-path="url(#kotel-clip)">
                ${[0, 1, 2, 3, 4, 5].map(r => [-1, 0, 1, 2, 3].map(c => {
                    const x = 8 + c * 24 + (r % 2 ? 12 : 0), y = 14 + r * 12.6;
                    const shade = ['#e6dbbf', '#d8c9a3', '#ece3cb', '#d1c19a'][(r + c + 4) % 4];
                    return `<rect x="${x + 1}" y="${y + 1}" width="22" height="10.6" rx="1.5" fill="${shade}"/>`;
                }).join('')).join('')}
                </g>
                <path d="M30 27 q3 -6 6 0 q2 -5 5 0" fill="none" stroke="#5f8a3e" stroke-width="2.5" stroke-linecap="round"/>
                <path d="M62 52 q3 -6 6 0 q2 -5 5 0" fill="none" stroke="#5f8a3e" stroke-width="2.5" stroke-linecap="round"/>` },
            { id: 'luchot', name: 'לוחות הברית', svg: `
                <path d="M12 90 V34 A18 18 0 0 1 48 34 V90 Z" fill="#ddd6c6" stroke="#8c8370" stroke-width="2.5"/>
                <path d="M52 90 V34 A18 18 0 0 1 88 34 V90 Z" fill="#ddd6c6" stroke="#8c8370" stroke-width="2.5"/>
                ${[['א', 'ב', 'ג', 'ד', 'ה'], ['ו', 'ז', 'ח', 'ט', 'י']].map((letters, t) => letters.map((l, i) =>
                    `<text x="${t === 0 ? 70 : 30}" y="${36 + i * 11.5}" text-anchor="middle" dominant-baseline="central" font-family="Frank Ruhl Libre, serif" font-size="11" font-weight="700" fill="#4d4636">${l}</text>`
                ).join('')).join('')}` },
            { id: 'tallit', name: 'טלית', svg: `
                <rect x="12" y="26" width="76" height="46" fill="#fffdf7" stroke="#c9bc9c" stroke-width="2"/>
                <rect x="19" y="26" width="5" height="46" fill="${INK}"/><rect x="27" y="26" width="2.5" height="46" fill="${INK}"/>
                <rect x="76" y="26" width="5" height="46" fill="${INK}"/><rect x="70.5" y="26" width="2.5" height="46" fill="${INK}"/>
                <rect x="38" y="26" width="24" height="7" fill="${GOLD}"/>
                ${[[12, 26], [88, 26], [12, 72], [88, 72]].map(([x, y]) => [-2, 0, 2].map(d =>
                    `<line x1="${x}" y1="${y}" x2="${x + d * 1.5}" y2="${y + (y < 50 ? -12 : 14)}" stroke="#9aa4b5" stroke-width="1.2"/>`
                ).join('')).join('')}` }
        ];

        const board = document.getElementById('board');
        const winBox = document.getElementById('win');
        let first = null, second = null, lock = false;
        let moves = 0, found = 0, pairs = 6, timer = null, seconds = 0, started = false;

        const shuffle = (arr) => {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        };

        const formatTime = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;

        function bestKey() { return `memory-best-${pairs}`; }
        function readBest() {
            try { return JSON.parse(localStorage.getItem(bestKey())); } catch (e) { return null; }
        }
        function saveBest(result) {
            try { localStorage.setItem(bestKey(), JSON.stringify(result)); } catch (e) { /* storage unavailable */ }
        }

        function newGame(pairCount) {
            pairs = pairCount;
            first = second = null;
            lock = false;
            moves = found = seconds = 0;
            started = false;
            clearInterval(timer);
            winBox.hidden = true;
            document.getElementById('moves').textContent = 0;
            document.getElementById('found').textContent = 0;
            document.getElementById('total').textContent = pairs;
            document.getElementById('time').textContent = '0:00';
            document.querySelectorAll('.level-btn').forEach(b =>
                b.setAttribute('aria-pressed', String(Number(b.dataset.pairs) === pairs)));

            board.style.setProperty('--cols', pairs === 12 ? 6 : 4);
            const chosen = shuffle(ITEMS).slice(0, pairs);
            board.innerHTML = '';
            shuffle([...chosen, ...chosen]).forEach(item => {
                const card = document.createElement('button');
                card.type = 'button';
                card.className = 'mem-card';
                card.dataset.id = item.id;
                card.setAttribute('aria-label', 'קלף הפוך');
                card.innerHTML = `
                    <div class="mem-inner">
                        <div class="mem-face mem-back"></div>
                        <div class="mem-face mem-front">
                            <svg viewBox="0 0 100 100" aria-hidden="true">${item.svg}</svg>
                            <span>${item.name}</span>
                        </div>
                    </div>`;
                card.addEventListener('click', () => flip(card, item));
                board.appendChild(card);
            });
        }

        function flip(card, item) {
            if (lock || card === first || card.classList.contains('matched')) return;
            if (!started) {
                started = true;
                timer = setInterval(() => {
                    document.getElementById('time').textContent = formatTime(++seconds);
                }, 1000);
            }
            card.classList.add('flipped');
            card.setAttribute('aria-label', item.name);

            if (!first) { first = card; return; }
            second = card;
            moves++;
            document.getElementById('moves').textContent = moves;

            if (first.dataset.id === second.dataset.id) {
                [first, second].forEach(c => { c.classList.add('matched'); c.setAttribute('aria-label', `${item.name} - נמצא זוג`); });
                first = second = null;
                found++;
                document.getElementById('found').textContent = found;
                if (found === pairs) finish();
            } else {
                lock = true;
                setTimeout(() => {
                    [first, second].forEach(c => { c.classList.remove('flipped'); c.setAttribute('aria-label', 'קלף הפוך'); });
                    first = second = null;
                    lock = false;
                }, 900);
            }
        }

        function finish() {
            clearInterval(timer);
            const best = readBest();
            const isRecord = !best || moves < best.moves || (moves === best.moves && seconds < best.seconds);
            if (isRecord) saveBest({ moves, seconds });
            const perfect = moves === pairs;
            winBox.innerHTML = `
                <h2>${perfect ? 'מושלם! בלי אף טעות' : 'כל הכבוד!'}</h2>
                <p>מצאתם את כל ${pairs} הזוגות ב־${moves} מהלכים, תוך ${formatTime(seconds)}.</p>
                <p>${isRecord ? 'זה השיא שלכם ברמה הזו!' : `השיא שלכם ברמה הזו: ${best.moves} מהלכים, ${formatTime(best.seconds)}`}</p>
                <button type="button" class="btn" id="again">משחק חדש</button>`;
            winBox.hidden = false;
            document.getElementById('again').addEventListener('click', () => newGame(pairs));
            winBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        document.querySelectorAll('.level-btn').forEach(btn =>
            btn.addEventListener('click', () => newGame(Number(btn.dataset.pairs))));

        newGame(6);
    </script>
</body>
</html>
